    <a routerLink="/" class="logo">
      <img src="assets/images/Logotype.png" alt="logo">
    </a>


    <div [class.burger-menu]="burger" (click)="burgerOn()"></div>

     <div class="header-menu" [class.active]="burger" (click)="burgerOn()">
      <nav>
        <ul>
          <li>
            <a fragment="services" routerLink='/'>Услуги</a>
          </li>
          <li>
            <a fragment="about" routerLink='/'>Онас</a>
          </li>
          <li>
            <a fragment="main-blog" routerLink="/">Статьи</a>
          </li>
          <li>
            <a fragment="main-reviews" routerLink="/">Отзывы</a>
          </li>
          <li>
            <a fragment="main-contacts" routerLink="/">Контакты</a>
          </li>
        </ul>
      </nav>
    </div>
    <a href="tel:+749934313340" class="header-phone">+7 (499) 343-13-34</a>
    <div class="header-auth">
      <div>

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

      <div class="header-auth-info">
        @if (isLogged()) {
          <p [matMenuTriggerFor]="menu">Привет, {{ userName() }}!</p>
          <mat-menu #menu="matMenu">
            <button mat-menu-item>
              <span (click)="logout()">Выйти</span>
            </button>
          </mat-menu>
        } @else {
          <div routerLink="/login">Войти</div>
        }
      </div>
    </div>
  </div>
